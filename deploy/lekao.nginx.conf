
# lekao.asterforge.top -> 127.0.0.1:3007 (Next.js)
server {
    listen 80;
    server_name lekao.asterforge.top;
    client_max_body_size 50M;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # ⭐ IP 限流（nginx 层兜底, 防单点 DDoS）
    # 20 r/s 每 IP + 短时 burst 50 + 超限立即 503
    limit_req zone=lekao_perip burst=50 nodelay;
    limit_req_status 503;
    limit_conn_status 503;

    # APK 静态下载 (绕过 next.js,直接 serve 文件)
    # 解决:微信/客户端点击 hero 按钮 → next 16 把 /downloads/ 当 app route → 500
    location /downloads/ {
        alias /home/ubuntu/Lekao/public/downloads/;
        autoindex off;
        # 强制 Content-Type (覆盖 mime.types 默认)
        types { application/vnd.android.package-archive apk; }
        default_type application/vnd.android.package-archive;
        # 强制下载 + 正确 content-type + 不缓存 (APK 是二进制)
        add_header Content-Disposition "attachment; filename=\"$arg_filename\"" always;
        add_header Content-Type "application/vnd.android.package-archive" always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
