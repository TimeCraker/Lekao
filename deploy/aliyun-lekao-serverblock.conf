# lekao.asterforge.top → Tencent :3007 (Lekao AI 智能助教助手)
# 架构: 用户浏览器 → 阿里云 SSL 终端 + 反代 → 腾讯云 Next.js :3007
# 注意: 不要在阿里云编译或运行 Node 服务（1.6GB 内存会 OOM）

# ─── HTTPS 主配置 ───
server {
    server_name lekao.asterforge.top;
    client_max_body_size 50M;  # 错题集 + 讲义图片上传支持
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    location / {
        proxy_pass http://111.229.200.178;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/lekao.asterforge.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lekao.asterforge.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ─── HTTP → HTTPS redirect ───
server {
    if ($host = lekao.asterforge.top) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name lekao.asterforge.top;
    return 404;
}