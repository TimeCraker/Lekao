<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" role="img" aria-label="LeKao banner">
  <defs>
    <linearGradient id="lkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1816"/>
      <stop offset="50%" stop-color="#241E1A"/>
      <stop offset="100%" stop-color="#12100E"/>
    </linearGradient>
    <radialGradient id="coralGlow" cx="80%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#CC785C" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#CC785C" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#CC785C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="20%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <style>
      .kicker { font: 700 11px ui-monospace, 'Cascadia Mono', monospace; fill: #CC785C; letter-spacing: 3px; }
      .title { font: 800 38px 'Segoe UI', -apple-system, sans-serif; fill: #FAF6F0; letter-spacing: -0.5px; }
      .sub { font: 500 14.5px 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #D6D3D1; }
      .tag { font: 600 11px ui-monospace, monospace; fill: #FAF6F0; }
      .card { fill: #2C2622; stroke: #443B35; stroke-width: 1; }
    </style>
  </defs>

  <rect width="920" height="280" rx="16" fill="url(#lkBg)"/>
  <rect width="920" height="280" rx="16" fill="url(#coralGlow)"/>
  <rect width="920" height="280" rx="16" fill="url(#emeraldGlow)"/>
  <rect width="920" height="280" rx="16" fill="none" stroke="#38302A" stroke-width="1.5"/>

  <!-- Left Graduation Cap / Book Emblem -->
  <g transform="translate(60, 65)">
    <rect x="10" y="24" width="76" height="56" rx="8" fill="#2C241E" stroke="#CC785C" stroke-width="2"/>
    <polygon points="48,8 88,24 48,40 8,24" fill="#CC785C"/>
    <line x1="88" y1="24" x2="88" y2="48" stroke="#FAF6F0" stroke-width="2"/>
    <circle cx="88" cy="50" r="3" fill="#FAF6F0"/>
    <path d="M 28 56 Q 48 46 68 56" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(190, 62)">
    <text x="0" y="20" class="kicker">EDTECH AI AGENT WORKBENCH · NEXT.JS 16 + PRISMA</text>
    <text x="0" y="64" class="title">LeKao · 乐考 AI 助教工作台</text>
    <text x="0" y="94" class="sub">面向 K12 培训机构助教与学管 · 错题集生成 · 课堂小结 · 微信课后反馈单</text>

    <!-- Pills -->
    <g transform="translate(0, 122)">
      <rect x="0" y="0" width="138" height="26" rx="5" class="card"/>
      <circle cx="12" cy="13" r="3.5" fill="#CC785C"/>
      <text x="24" y="17" class="tag">Next.js 16 + React 19</text>

      <rect x="150" y="0" width="148" height="26" rx="5" class="card"/>
      <circle cx="162" cy="13" r="3.5" fill="#10B981"/>
      <text x="174" y="17" class="tag">Qwen-VL + DeepSeek</text>

      <rect x="310" y="0" width="138" height="26" rx="5" class="card"/>
      <circle cx="322" cy="13" r="3.5" fill="#38BDF8"/>
      <text x="334" y="17" class="tag">Word Docx Engine</text>

      <rect x="460" y="0" width="128" height="26" rx="5" class="card"/>
      <circle cx="472" cy="13" r="3.5" fill="#FBBF24"/>
      <text x="484" y="17" class="tag">Free T-Coin System</text>
    </g>
  </g>
</svg>
